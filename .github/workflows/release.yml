name: Release

# Pushing a tag such as v0.1.0 builds the linux amd64/arm64 archives with goreleaser and publishes a
# GitHub release with checksums.txt, install.sh and uninstall.sh attached. tunlr upgrade and install.sh
# download from these releases and verify the sha256 that GitHub records for each asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
