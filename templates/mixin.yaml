# tunlr mixin：在订阅之上叠加你自己的设置。下面全是注释掉的示例，按需取消注释。
#
# /etc/tunlr/mixin.d/ 下的 *.yaml 按文件名顺序逐个应用，后面的文件优先。
# 可以按用途分文件，用数字前缀排序，例如 10-dns.yaml、20-nodes.yaml、50-rules.yaml。
# 文件名逐字符比较，前缀请用相同的位数：9-a.yaml 会排在 10-b.yaml 之后。
# tunlr 的命令管理的键（TUN 开关、API 的监听地址和 secret、geo 数据的自动更新等）这里不能写，
# 写了会被拒绝并提示改用哪个命令；tunlr mixin list 列出它们。经 GitHub 镜像的下载地址和直连
# 规则只是默认值，在所有文件之前应用，可以在这里覆盖。
# 用 tunlr edit 编辑会在保存时自动检查；直接改文件的，用 tunlr plan 预览、tunlr apply 发布。
#
# 写法与 mihomo 配置相同，另有几种前缀操作：
#   键: 值                    映射逐层合并，标量和列表整体替换
#   键: null                  删除这个键
#   prepend-键 / append-键    在列表前面插入 / 后面追加（规则追加在最后的 MATCH 之前）
#   patch-键                  按 name 修改列表中已有的项，项里同样可以用这些写法
#   delete-键                 按 name 删除列表中的项（字符串列表按值）；
#                             删除节点或策略组时，同时从所有策略组中移除
# 前缀在任何一层都能用，例如 dns 下的 prepend-nameserver。
# name 写成 /正则/ 时匹配所有符合的项。
# 同一层中按 替换 → 删除 → 修改 → 插入 的顺序执行，与书写顺序无关。
# 规则中含有逗号，要像下面的示例那样逐行写；写成 [A,B,C] 会被拆成三项。
# 顶层以 x- 开头的键不写入配置，可以用来放 YAML 锚点。

# ---- 通用设置 ----
# log-level: warning
# dns:
#   prepend-nameserver:
#     - 192.168.1.1

# ---- 自己的节点 ----
# append-proxies:
#   - {name: 家宽, type: socks5, server: 203.0.113.1, port: 1080}

# ---- 修改订阅的节点和策略组 ----
# patch-proxies:
#   - name: /香港/
#     udp: true
# patch-proxy-groups:
#   - name: 节点选择
#     prepend-proxies: [家宽]
#   - name: /自动选择|故障转移/
#     interval: 600

# ---- 去掉机场的信息节点 ----
# delete-proxies:
#   - /剩余流量|套餐到期|官网/

# ---- 规则 ----
# prepend-rules:        # 优先于订阅的规则
#   - DOMAIN-SUFFIX,corp.example.com,家宽
# append-rules:         # 订阅的规则都没有命中时
#   - GEOIP,LAN,DIRECT
