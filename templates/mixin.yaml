#       - "+.corp.example.com"
#     delete:
#       - "stun.*.*"
#
#   # ---- 只要一部分节点 ----
#   proxy-filter:
#     # filter: (?i)港|hk|日本        # 白名单：只保留匹配的节点
#     exclude-filter: 倍率           # 黑名单：去掉匹配的节点
#     # exclude-type: ssr|vmess      # 去掉这些类型的节点
#
#   # ---- 自己的节点，去掉机场的信息节点 ----
#   proxies:
#     append:
#       - {name: 家宽, type: socks5, server: 203.0.113.1, port: 1080}
#     delete:
#       - /剩余流量|套餐到期|官网/
#
#   # ---- 修改订阅的策略组 ----
#   proxy-groups:
#     patch:
#       - name: 节点选择
#         prepend-proxies: [家宽]
#       - name: /自动选择|故障转移/
#         interval: 600
#
